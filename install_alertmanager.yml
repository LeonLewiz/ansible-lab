- name: Install Alertmanager.
  hosts: monitoring
  become: yes
  tasks:
    - name: Installing Alertmanager.
      get_url:
        url: https://github.com/prometheus/alertmanager/releases/download/v0.34.0/alertmanager-0.34.0.linux-amd64.tar.gz
        dest: /tmp
        checksum: sha256:https://github.com/prometheus/alertmanager/releases/download/v0.34.0/sha256sums.txt
        
    - name: Create a directory
      ansible.builtin.file:
        path: /usr/local/bin/alertmanager
        state: directory
        mode: '0755'
    
    - name: Extract
      ansible.builtin.unarchive:
        src: /tmp/alertmanager-0.34.0.linux-amd64.tar.gz
        dest: /usr/local/bin/alertmanager
        creates: /usr/local/bin/alertmanager/alertmanager
        remote_src: true
        extra_opts: ['--strip-components=1']

    - name: Template
      template:
        src: ./group_vars/all/templates/alertmanager.yml.j2
        dest: /usr/local/bin/alertmanager/alertmanager.yml
        mode: '0755'

    - name: Create systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/alertmanager.service
        content: |
          [Unit]
          Description=alertmanager
          After=network.target

          [Service]
          ExecStart=/usr/local/bin/alertmanager/alertmanager --cluster.listen-address= --config.file=/usr/local/bin/alertmanager/alertmanager.yml --web.listen-address=0.0.0.0:9093
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start alertmanager
      ansible.builtin.systemd:
        name: alertmanager.service
        daemon_reload: true
        enabled: true
        state: started
